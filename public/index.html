<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みしゃゲーム 🎀 じゅんびちゅう</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #ffe3ef 0%, #f3e3ff 60%, #e3f5ff 100%);
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      color: #b35c8d;
      text-align: center;
    }
    .heart { font-size: 64px; animation: bounce 1.6s ease-in-out infinite; }
    h1 { font-size: 32px; margin: 16px 0 8px; }
    p { font-size: 18px; margin: 4px 0; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
  </style>
</head>
<body>
  <div class="heart">💖</div>
  <h1>みしゃゲーム</h1>
  <p>いま じゅんびちゅうだよ 🎀</p>
  <p>もうすこし まっててね!</p>
</body>
</html>
